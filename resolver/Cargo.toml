[package]
name = "movi-movie-resolver"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

[dependencies]
argon2 = "0.5"
axum = { version = "0.8", features = ["form", "json"] }
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
futures = "0.3"
percent-encoding = "2"
moka = { version = "0.12", features = ["future"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
tower-http = { version = "0.6", features = ["fs"] }

url = "2"

[profile.release]
strip = true
